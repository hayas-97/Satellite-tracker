<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Satellite Tracker Pro</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    html,
    body {
      height: 100%;
      width: 100%;
      background: #071321;
      overflow: hidden;
      color: white;
    }

    #map {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 1;
    }

    /* Information Panel */
    .info-panel {
      position: absolute;
      top: 15px;
      left: 15px;
      width: 310px;
      background: rgba(10, 20, 40, 0.88);
      backdrop-filter: blur(15px);
      border-radius: 15px;
      padding: 15px;
      z-index: 1000;
      box-shadow: 0 0 20px rgba(0, 0, 0, .4);
    }

    .info-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
      color: #4fc3f7;
    }

    .info-panel div {
      margin-top: 6px;
      font-size: 14px;
    }

    .sat-list {
      margin-top: 10px;
      max-height: 200px;
      overflow-y: auto;
    }

    .sat-item {
      padding: 8px;
      margin-top: 5px;
      background: rgba(255, 255, 255, .06);
      border-radius: 8px;
      cursor: pointer;
      transition: .3s;
    }

    .sat-item:hover {
      background: #2196F3;
    }

    .sat-item.active {
      background: #03A9F4;
    }

    .search {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      outline: none;
      font-size: 14px;
    }

    /* Buttons */
    .location-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      padding: 12px 18px;
      background: #2196F3;
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 15px;
      cursor: pointer;
      z-index: 1200;
      transition: .3s;
    }

    .location-btn:hover {
      background: #1976D2;
    }

    .full-btn {
      position: absolute;
      top: 70px;
      right: 15px;
      padding: 12px 18px;
      background: #4CAF50;
      border: none;
      border-radius: 10px;
      color: white;
      cursor: pointer;
      z-index: 1200;
    }

    .status-box {
      position: absolute;
      top: 125px;
      right: 15px;
      background: rgba(10, 20, 40, .9);
      padding: 10px;
      border-radius: 10px;
      z-index: 1200;
      font-size: 13px;
    }

    .clock-box {
      position: absolute;
      top: 180px;
      right: 15px;
      background: rgba(10, 20, 40, .9);
      padding: 10px;
      border-radius: 10px;
      z-index: 1200;
      font-size: 13px;
    }

    /* Footer & Coordinates */
    .footer {
      position: absolute;
      bottom: 12px;
      left: 15px;
      background: rgba(10, 20, 40, .88);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      z-index: 1000;
    }

    .coordinate-box {
      position: absolute;
      bottom: 15px;
      right: 15px;
      background: rgba(10, 20, 40, .88);
      padding: 10px;
      border-radius: 10px;
      z-index: 1000;
      font-size: 13px;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-thumb {
      background: #2196F3;
      border-radius: 5px;
    }
  </style>
</head>

<body>

  <div id="map"></div>

  <!-- Info Panel -->
  <div class="info-panel">
    <div class="info-title">🛰 Live Satellite Tracker</div>
    <input type="text" id="search" class="search" placeholder="Search Satellite...">
    <br><br>
    <div><b>Name:</b> <span id="info-name">--</span></div>
    <div><b>Latitude:</b> <span id="info-lat">--</span></div>
    <div><b>Longitude:</b> <span id="info-lon">--</span></div>
    <div><b>Altitude:</b> <span id="info-alt">--</span></div>
    <div><b>Velocity:</b> <span id="info-vel">--</span></div>
    <div><b>Distance:</b> <span id="info-distance">--</span></div>
    <div class="sat-list" id="sat-list"></div>
  </div>

  <!-- Controls -->
  <button class="location-btn" onclick="requestLocation()">📍 My Location</button>
  <button class="full-btn" onclick="toggleFullscreen()">⛶ Full Screen</button>

  <div id="gps-status" class="status-box">📡 GPS: Click "My Location"</div>
  <div id="clock" class="clock-box">🕒 Loading time...</div>

  <!-- Footer -->
  <div class="footer">
    <b>WEB CREATED BY</b><br><br>
    1. Hayas Joyshan S.M.<br>
  </div>

  <!-- Coordinates -->
  <div class="coordinate-box">
    Latitude: <span id="myLat">--</span><br>
    Longitude: <span id="myLon">--</span><br>
    Accuracy: <span id="accuracy">--</span>
  </div>

  <!-- Libraries -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/satellite.js@4.0.0/dist/satellite.min.js"></script>

  <script>
    /* Initialize Map */
    const map = L.map("map", {
      zoomControl: true,
      worldCopyJump: true,
      preferCanvas: true
    }).setView([20, 0], 2);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "© OpenStreetMap"
    }).addTo(map);

    L.control.scale({ metric: true, imperial: false }).addTo(map);

    /* Icons */
    const satIcon = L.icon({
  iconUrl: "satellite-icon.png",
  iconSize: [40, 40],
  iconAnchor: [20, 20],
  popupAnchor: [0, -20]
});

    const userIcon = L.icon({
      iconUrl: "https://cdn-icons-png.flaticon.com/512/684/684908.png",
      iconSize: [30, 30],
      iconAnchor: [15, 30]
    });

    /* State Variables */
    let userMarker = null;
    let selectedSatellite = null;
    let myLatitude = null;
    let myLongitude = null;
    let watchId = null;
    const sats = [];
    const listEl = document.getElementById("sat-list");

    /* TLE Satellite Data */
    const satsData = {
      "ISS (ZARYA)": [
        "1 25544U 98067A   25257.12345678  .00003435  00000-0 66910-4 0 9991",
        "2 25544 51.6446 208.4746 0007415 63.9413 50.6269 15.49933222385377"
      ],
      "Hubble Space Telescope": [
        "1 20580U 90037B   25257.12345678  .00000678 00000-0 34567-4 0 9992",
        "2 20580 28.4700 80.0000 0003200 100.0000 300.0000 15.00000000123456"
      ],
      "Starlink V2": [
        "1 45300U 20002B   25257.12345678  .00000280 00000-0 12348-4 0 9993",
        "2 45300 53.3000 75.0000 0001237 100.0000 300.0000 15.0000000012345"
      ]
    };

    /* Build Satellites */
    Object.keys(satsData).forEach((name, index) => {
      const sat = { name, tle: satsData[name] };
      sat.marker = L.marker([0, 0], { icon: satIcon }).addTo(map);
      sat.marker.bindTooltip(name);
      sat.marker.on("click", () => selectSatellite(sat));
      sats.push(sat);

      const item = document.createElement("div");
      item.className = "sat-item";
      item.id = "sat-" + index;
      item.innerHTML = "🛰 " + name;
      item.onclick = () => selectSatellite(sat);
      listEl.appendChild(item);
    });

    /* TLE to Geodetic Position */
    function tleToGeodetic(tle) {
      try {
        const satrec = satellite.twoline2satrec(tle[0], tle[1]);
        const now = new Date();
        const posVel = satellite.propagate(satrec, now);
        if (!posVel.position) return null;

        const gmst = satellite.gstime(now);
        const geo = satellite.eciToGeodetic(posVel.position, gmst);

        return {
          latitude: satellite.degreesLat(geo.latitude),
          longitude: satellite.degreesLong(geo.longitude),
          height: geo.height * 1000,
          velocity: Math.sqrt(
            Math.pow(posVel.velocity.x, 2) +
            Math.pow(posVel.velocity.y, 2) +
            Math.pow(posVel.velocity.z, 2)
          )
        };
      } catch (e) {
        return null;
      }
    }

    function updateSatellites() {
      sats.forEach(s => {
        const props = tleToGeodetic(s.tle);
        if (!props) return;

        s.props = props;
        s.marker.setLatLng([props.latitude, props.longitude]);

        if (selectedSatellite === s) {
          document.getElementById("info-lat").innerHTML = props.latitude.toFixed(4) + "°";
          document.getElementById("info-lon").innerHTML = props.longitude.toFixed(4) + "°";
          document.getElementById("info-alt").innerHTML = (props.height / 1000).toFixed(2) + " km";
          document.getElementById("info-vel").innerHTML = props.velocity.toFixed(2) + " km/s";

          if (myLatitude !== null && myLongitude !== null) {
            const dist = calculateDistance(myLatitude, myLongitude, props.latitude, props.longitude);
            document.getElementById("info-distance").innerHTML = dist.toFixed(2) + " km";
          }
        }
      });
    }

    function selectSatellite(s) {
      selectedSatellite = s;
      document.querySelectorAll(".sat-item").forEach(i => i.classList.remove("active"));
      const id = sats.indexOf(s);
      if (id !== -1) document.getElementById("sat-" + id).classList.add("active");
      document.getElementById("info-name").innerHTML = s.name;
      updateSatellites();
    }

    /* Distance Calculation */
    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    /* Single Unified Geolocation Request */
    function requestLocation() {
      if (!navigator.geolocation) {
        alert("Geolocation is not supported by your browser.");
        return;
      }

      if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
        alert("Geolocation requires HTTPS or running on a local web server (http://localhost).");
      }

      document.getElementById("gps-status").innerHTML = "📡 GPS: Locating...";

      if (watchId) navigator.geolocation.clearWatch(watchId);

      watchId = navigator.geolocation.watchPosition(
        (position) => {
          myLatitude = position.coords.latitude;
          myLongitude = position.coords.longitude;
          const accuracy = position.coords.accuracy;

          document.getElementById("myLat").innerHTML = myLatitude.toFixed(5);
          document.getElementById("myLon").innerHTML = myLongitude.toFixed(5);
          document.getElementById("accuracy").innerHTML = Math.round(accuracy) + " m";
          document.getElementById("gps-status").innerHTML = "📡 GPS Connected";

          if (userMarker) {
            userMarker.setLatLng([myLatitude, myLongitude]);
          } else {
            userMarker = L.marker([myLatitude, myLongitude], { icon: userIcon }).addTo(map);
            userMarker.bindPopup("<b>📍 Your Current Location</b>");
            map.setView([myLatitude, myLongitude], 6);
          }
        },
        (error) => {
          document.getElementById("gps-status").innerHTML = "❌ GPS Permission Denied";
          alert("Location permission was denied or failed. Please check browser settings.");
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    }

    /* Search Filter */
    document.getElementById("search").addEventListener("keyup", function () {
      const value = this.value.toLowerCase();
      document.querySelectorAll(".sat-item").forEach(item => {
        item.style.display = item.innerText.toLowerCase().includes(value) ? "block" : "none";
      });
    });

    /* Clock */
    setInterval(() => {
      const now = new Date();
      document.getElementById("clock").innerHTML = "🕒 <b>Time</b><br>" + now.toLocaleTimeString();
    }, 1000);

    /* Fullscreen Mode */
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }

    /* App Initialization */
    if (sats.length > 0) selectSatellite(sats[0]);
    setInterval(updateSatellites, 1000);
    updateSatellites();
  </script>
</body>

</html>
